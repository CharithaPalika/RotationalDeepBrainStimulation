      base-left  = tip - 14*(+0.707,+0.707) + 7*(-0.707,+0.707) = (1089-9.9-4.9, 246-9.9+4.9) = (1074, 241)
      base-right = tip - 14*(+0.707,+0.707) - 7*(-0.707,+0.707) = (1089-9.9+4.9, 246-9.9-4.9) = (1084, 231)
    ══════════════════════════════════════════════════════
    -->

    <!-- S0: top-left, blue   M CK_CX,CK_CY  L left  A→ top  Z -->
    <path d="M 1160,175 L 1060,175 A 100,100 0 0,1 1160,75 Z"
          fill="#ddeeff" stroke="#2255aa" stroke-width="2.2"/>
    <!-- S1: bottom-left, orange   L bottom  A→ left  Z -->
    <path d="M 1160,175 L 1160,275 A 100,100 0 0,1 1060,175 Z"
          fill="#fde8cc" stroke="#cc5500" stroke-width="2.2"/>
    <!-- S2: bottom-right, green   L right  A→ bottom  Z -->
    <path d="M 1160,175 L 1260,175 A 100,100 0 0,1 1160,275 Z"
          fill="#d8f5d8" stroke="#1a6e1a" stroke-width="2.2"/>
    <!-- S3: top-right, purple   L top  A→ right  Z -->
    <path d="M 1160,175 L 1160,75  A 100,100 0 0,1 1260,175 Z"
          fill="#f0e0ff" stroke="#7030a0" stroke-width="2.2"/>

    <!-- Spokes -->
    <line x1="1160" y1="175" x2="1160" y2="75"  stroke="#555" stroke-width="1.3" stroke-dasharray="4,3"/>
    <line x1="1160" y1="175" x2="1260" y2="175" stroke="#555" stroke-width="1.3" stroke-dasharray="4,3"/>
    <line x1="1160" y1="175" x2="1160" y2="275" stroke="#555" stroke-width="1.3" stroke-dasharray="4,3"/>
    <line x1="1160" y1="175" x2="1060" y2="175" stroke="#555" stroke-width="1.3" stroke-dasharray="4,3"/>

    <!-- Degree labels  (CK_CX, CK_CY ± R ± gap) -->
    <!-- 0°   top    (CK_CX,   CK_CY-R-14) = (1160,  61) -->
    <text x="1160" y="61"  text-anchor="middle" font-size="19" fill="#111" font-weight="bold">0°</text>
    <!-- 90°  right  (CK_CX+R+16, CK_CY+6) = (1276, 181) -->
    <text x="1276" y="181" text-anchor="start"  font-size="19" fill="#111" font-weight="bold">90°</text>
    <!-- 180° bottom (CK_CX,   CK_CY+R+20) = (1160, 295) -->
    <text x="1160" y="295" text-anchor="middle" font-size="19" fill="#111" font-weight="bold">180°</text>
    <!-- 270° left   (CK_CX-R-16, CK_CY+6) = (1044, 181) -->
    <text x="1044" y="181" text-anchor="end"    font-size="19" fill="#111" font-weight="bold">270°</text>

    <!-- Sector labels — quadrant centres at (CK_CX ± R/2, CK_CY ± R/2) = ±50 -->
    <!-- S0 top-left    (1110, 125) -->
    <text x="1110" y="125" text-anchor="middle" font-size="19" font-weight="bold" fill="#2255aa">S0</text>
    <text x="1110" y="145" text-anchor="middle" font-size="14"                    fill="#2255aa">0°–90°</text>
    <!-- S1 bottom-left (1110, 225) -->
    <text x="1110" y="222" text-anchor="middle" font-size="19" font-weight="bold" fill="#cc5500">S1</text>
    <text x="1110" y="242" text-anchor="middle" font-size="14"                    fill="#cc5500">90°–180°</text>
    <!-- S2 bottom-right (1210, 225) -->
    <text x="1210" y="222" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a6e1a">S2</text>
    <text x="1210" y="242" text-anchor="middle" font-size="14"                    fill="#1a6e1a">180°–270°</text>
    <!-- S3 top-right   (1210, 125) -->
    <text x="1210" y="125" text-anchor="middle" font-size="19" font-weight="bold" fill="#7030a0">S3</text>
    <text x="1210" y="145" text-anchor="middle" font-size="14"                    fill="#7030a0">270°–360°</text>

    <!-- Centre dot -->
    <circle cx="1160" cy="175" r="6" fill="#111" stroke="#fff" stroke-width="1.5"/>
    <text x="1172" y="194" font-size="15" fill="#333" font-style="italic">
      (c<tspan baseline-shift="sub" font-size="11">x</tspan>, c<tspan baseline-shift="sub" font-size="11">y</tspan>)
    </text>

    <!-- CW rotation arrow: ON the rim (r=100), left side, S0→S1
         Arc from (1089,104) to (1089,246), sweep=1 (CW in SVG) -->
    <!-- <path d="M 1089,104 A 100,100 0 0,1 1089,246"
          fill="none" stroke="#333" stroke-width="2.5"/> -->
          <path d="M 1058,104 A 100,100 0 0,0 1058,246"
      fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Arrowhead at (1089,246): tip pointing (+0.707,+0.707) i.e. down-right
         Computed: tip=(1058,246), p1=(1043,241), p2=(1053,231) -->
    <polygon points="1058,246 1043,241 1053,231" fill="#333"/>

    <!-- f_rot label: to the left of the arc, vertically centred on clock -->
    <text x="1072" y="180" text-anchor="end" font-size="18" fill="#333" font-style="italic">f<tspan baseline-shift="sub" font-size="13">rot</tspan></text>

  </g>
  <!-- END (d) rDBS ════════════════════════════════════════════════ -->

</svg>

<script>
(function(){
  /*
  ══════════════════════════════════════════════════════════════════
  LAYOUT CONSTANTS  — update these to reposition entire sub-panels.
  The values here must match the translate()/scale() in the SVG above.

  Panel (a) BG:     BG_TX=18,    BG_TY=68,   BG_S=0.93   (static)
  Panel (b) Pulse:  PULSE_TX=1098, PULSE_TY=62, PULSE_S=0.68 (static)
  Panel (b) Params: PARAM_TX=1506, PARAM_TY=62, PARAM_S=0.82 (static)
  Panel (c) sDBS:   SDBS_TX=1745,  SDBS_TY=62,  SDBS_S=1.18  (JS grid)
  Panel (d) rDBS:   RDBS_TX=1095,  RDBS_TY=614, RDBS_S=0.88  (JS grids)
  ══════════════════════════════════════════════════════════════════
  */

  const ns = 'http://www.w3.org/2000/svg';

  // ── (c) sDBS grid ─────────────────────────────────────────────
  // Internal grid: top-left at (80,48), cell=16, N=16
  // SDBS_TX=1745  SDBS_TY=62  SDBS_S=1.18
  const sN=16, sCell=16, sox=80, soy=48, sc=7, sSigma=4;
  const sGrid = document.getElementById('sdbs-grid');
  for(let i=0;i<sN;i++){
    for(let j=0;j<sN;j++){
      const w = Math.exp(-((i-sc)**2+(j-sc)**2)/(2*sSigma**2));
      const r = Math.round(255-(255-204)*w);
      const g = Math.round(255-(255-34)*w);
      const b = Math.round(255-255*w);
      const rect = document.createElementNS(ns,'rect');
      rect.setAttribute('x', sox + j*sCell);
      rect.setAttribute('y', soy + i*sCell);
      rect.setAttribute('width',  sCell);
      rect.setAttribute('height', sCell);
      rect.setAttribute('fill',   `rgb(${r},${g},${b})`);
      rect.setAttribute('stroke', '#ccc');
      rect.setAttribute('stroke-width','0.4');
      sGrid.appendChild(rect);
    }
  }

  // ── (d) rDBS grids ─────────────────────────────────────────────
  // RDBS_TX=1095  RDBS_TY=614  RDBS_S=0.88
  const rN=16, rCell=13, half=rN/2;
  const gridOrigins = [{x:10,y:55},{x:228,y:55},{x:446,y:55},{x:664,y:55}];
  const sectorQuads = [
    {rMin:0, rMax:8, cMin:0, cMax:8 },
    {rMin:8, rMax:16,cMin:0, cMax:8 },
    {rMin:8, rMax:16,cMin:8, cMax:16},
    {rMin:0, rMax:8, cMin:8, cMax:16}
  ];
  const activeColors = ['#2255aa','#cc5500','#1a6e1a','#7030a0'];
  const hexBase = {
    '#2255aa':[34,85,170],
    '#cc5500':[204,85,0],
    '#1a6e1a':[26,110,26],
    '#7030a0':[112,48,160]
  };
  const rGrids = document.getElementById('rdbs-grids');
  const c_idx=7, rSigma=4;

  gridOrigins.forEach((origin, sIdx) => {
    const quad = sectorQuads[sIdx];
    const col  = activeColors[sIdx];
    // Fill cells
    for(let i=0;i<rN;i++){
      for(let j=0;j<rN;j++){
        const isActive = i>=quad.rMin && i<quad.rMax && j>=quad.cMin && j<quad.cMax;
        let fill;
        if(isActive){
          const w = Math.exp(-((i-c_idx)**2+(j-c_idx)**2)/(2*rSigma**2));
          const [r0,g0,b0] = hexBase[col];
          fill = `rgb(${Math.round(255-(255-r0)*w)},${Math.round(255-(255-g0)*w)},${Math.round(255-(255-b0)*w)})`;
        } else { fill = '#f0f0f0'; }
        const rect = document.createElementNS(ns,'rect');
        rect.setAttribute('x', origin.x + j*rCell);
        rect.setAttribute('y', origin.y + i*rCell);
        rect.setAttribute('width',  rCell);
        rect.setAttribute('height', rCell);
        rect.setAttribute('fill',   fill);
        rect.setAttribute('stroke', '#ccc');
        rect.setAttribute('stroke-width','0.3');
        rGrids.appendChild(rect);
      }
    }
    // Outer border
    const border = document.createElementNS(ns,'rect');
    border.setAttribute('x', origin.x); border.setAttribute('y', origin.y);
    border.setAttribute('width', rN*rCell); border.setAttribute('height', rN*rCell);
    border.setAttribute('fill','none'); border.setAttribute('stroke', col);
    border.setAttribute('stroke-width','2.5');
    rGrids.appendChild(border);
    // Quadrant dividers
    const mid = half*rCell;
    const vl = document.createElementNS(ns,'line');
    vl.setAttribute('x1',origin.x+mid); vl.setAttribute('y1',origin.y);
    vl.setAttribute('x2',origin.x+mid); vl.setAttribute('y2',origin.y+rN*rCell);
    vl.setAttribute('stroke','#999'); vl.setAttribute('stroke-width','1');
    rGrids.appendChild(vl);
    const hl = document.createElementNS(ns,'line');
    hl.setAttribute('x1',origin.x);          hl.setAttribute('y1',origin.y+mid);
    hl.setAttribute('x2',origin.x+rN*rCell); hl.setAttribute('y2',origin.y+mid);
    hl.setAttribute('stroke','#999'); hl.setAttribute('stroke-width','1');
    rGrids.appendChild(hl);
    // Active-quadrant highlight
    const hi = document.createElementNS(ns,'rect');
    hi.setAttribute('x', origin.x + quad.cMin*rCell);
    hi.setAttribute('y', origin.y + quad.rMin*rCell);
    hi.setAttribute('width',  (quad.cMax-quad.cMin)*rCell);
    hi.setAttribute('height', (quad.rMax-quad.rMin)*rCell);
    hi.setAttribute('fill','none'); hi.setAttribute('stroke', col);
    hi.setAttribute('stroke-width','3');
    rGrids.appendChild(hi);
  });

})();
</script>
</body>
