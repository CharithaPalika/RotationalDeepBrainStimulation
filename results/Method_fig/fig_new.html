      <text x="0"    y="118"  text-anchor="middle" font-size="16" fill="#111" font-weight="bold">270°</text>
      <text x="-114" y="5"    text-anchor="end"    font-size="16" fill="#111" font-weight="bold">180°</text>

      <!-- Sector labels -->
      <text x="50"  y="-52" text-anchor="middle" font-size="18" font-weight="bold" fill="#2255aa">S-1</text>
      <text x="50"  y="-33" text-anchor="middle" font-size="13"                    fill="#2255aa">0°–90°</text>
      <text x="-50" y="-52" text-anchor="middle" font-size="18" font-weight="bold" fill="#7030a0">S-2</text>
      <text x="-50" y="-33" text-anchor="middle" font-size="13"                    fill="#7030a0">90°–180°</text>
      <text x="-50" y="44"  text-anchor="middle" font-size="18" font-weight="bold" fill="#cc5500">S-3</text>
      <text x="-50" y="63"  text-anchor="middle" font-size="13"                    fill="#cc5500">180°–270°</text>
      <text x="50"  y="44"  text-anchor="middle" font-size="18" font-weight="bold" fill="#1a6e1a">S-4</text>
      <text x="50"  y="63"  text-anchor="middle" font-size="13"                    fill="#1a6e1a">270°–360°</text>

      <!-- Centre dot + label -->
      <circle cx="0" cy="0" r="5" fill="#111" stroke="#fff" stroke-width="1.5"/>
      <text x="10" y="17" font-size="13" fill="#333" font-style="italic">
        (c<tspan baseline-shift="sub" font-size="10">x</tspan>, c<tspan baseline-shift="sub" font-size="10">y</tspan>)
      </text>

      <!-- CCW rotation arrow -->
      <path d="M 90,-61 A 100,100 0 0,0 -90,61" fill="none" stroke="#333" stroke-width="2.2"/>
      <polygon points="-93,65 -83,69 -86,57" fill="#333"/>

      <!-- f_rot label -->
      <text x="-96" y="70" text-anchor="end" font-size="17" fill="#333" font-style="italic">f<tspan baseline-shift="sub" font-size="12">rot</tspan></text>

      <!-- f_rot equation below clock -->
      <text x="0" y="170" text-anchor="middle" font-size="17" fill="#333" font-style="italic" font-weight="bold">
        f<tspan baseline-shift="sub" font-size="12">rot</tspan>
        <tspan> = 5 Hz,  T</tspan><tspan baseline-shift="sub" font-size="12">s</tspan>

  </g>
  <!-- END (d) rDBS ════════════════════════════════════════════════ -->

</svg>

<script>

(function(){
  const ns = 'http://www.w3.org/2000/svg';

  // ── (c) sDBS grid ─────────────────────────────────────────────
  const sN=16, sCell=16, sox=80, soy=48, sc=7, sSigma=3.25;
  const sGrid = document.getElementById('sdbs-grid');
  for(let i=0;i<sN;i++){
    for(let j=0;j<sN;j++){
      const w = Math.exp(-((i-sc)**2+(j-sc)**2)/(2*sSigma**2));
      const r = Math.round(255-(255-204)*w);
      const g = Math.round(255-(255-34)*w);
      const b = Math.round(255-255*w);
      const rect = document.createElementNS(ns,'rect');
      rect.setAttribute('x', sox + j*sCell);
      rect.setAttribute('y', soy + i*sCell);
      rect.setAttribute('width',  sCell);
      rect.setAttribute('height', sCell);
      rect.setAttribute('fill',   `rgb(${r},${g},${b})`);
      rect.setAttribute('stroke', '#ccc');
      rect.setAttribute('stroke-width','0.4');
      sGrid.appendChild(rect);
    }
  }

  // ── (d) rDBS grids ─────────────────────────────────────────────
  // rCell=13, grid=208px, gap=55px
  // Top row y=55..263, bottom row y=338..546
  const rN=16, rCell=13, half=rN/2;
  const gridOrigins = [
    {x:10,  y:25 },   // Sector-2: top-left,    purple
    {x:248, y:25 },   // Sector-1: top-right,   blue
    {x:10,  y:350},   // Sector-3: bottom-left, orange
    {x:248, y:350}    // Sector-4: bottom-right, green
  ];
  const sectorQuads = [
    {rMin:0, rMax:8,  cMin:0, cMax:8 },   // Sector-2: top-left active
    {rMin:0, rMax:8,  cMin:8, cMax:16},   // Sector-1: top-right active
    {rMin:8, rMax:16, cMin:0, cMax:8 },   // Sector-3: bottom-left active
    {rMin:8, rMax:16, cMin:8, cMax:16}    // Sector-4: bottom-right active
  ];
  const activeColors = ['#7030a0','#2255aa','#cc5500','#1a6e1a'];
  const hexBase = {
    '#2255aa':[34,85,170],
    '#7030a0':[112,48,160],
    '#cc5500':[204,85,0],
    '#1a6e1a':[26,110,26]
  };
  const rGrids = document.getElementById('rdbs-grids');
  const c_idx=7, rSigma=3.25;

  gridOrigins.forEach((origin, sIdx) => {
    const quad = sectorQuads[sIdx];
    const col  = activeColors[sIdx];
    for(let i=0;i<rN;i++){
      for(let j=0;j<rN;j++){
        const isActive = i>=quad.rMin && i<quad.rMax && j>=quad.cMin && j<quad.cMax;
        let fill;
        if(isActive){
          const w = Math.exp(-((i-c_idx)**2+(j-c_idx)**2)/(2*rSigma**2));
          const [r0,g0,b0] = hexBase[col];
          fill = `rgb(${Math.round(255-(255-r0)*w)},${Math.round(255-(255-g0)*w)},${Math.round(255-(255-b0)*w)})`;
        } else { fill = '#f0f0f0'; }
        const rect = document.createElementNS(ns,'rect');
        rect.setAttribute('x', origin.x + j*rCell);
        rect.setAttribute('y', origin.y + i*rCell);
        rect.setAttribute('width',  rCell);
        rect.setAttribute('height', rCell);
        rect.setAttribute('fill',   fill);
        rect.setAttribute('stroke', '#ccc');
        rect.setAttribute('stroke-width','0.3');
        rGrids.appendChild(rect);
      }
    }
    const border = document.createElementNS(ns,'rect');
    border.setAttribute('x', origin.x); border.setAttribute('y', origin.y);
    border.setAttribute('width', rN*rCell); border.setAttribute('height', rN*rCell);
    border.setAttribute('fill','none'); border.setAttribute('stroke', col);
    border.setAttribute('stroke-width','2.5');
    rGrids.appendChild(border);
    const mid = half*rCell;
    const vl = document.createElementNS(ns,'line');
    vl.setAttribute('x1',origin.x+mid); vl.setAttribute('y1',origin.y);
    vl.setAttribute('x2',origin.x+mid); vl.setAttribute('y2',origin.y+rN*rCell);
    vl.setAttribute('stroke','#999'); vl.setAttribute('stroke-width','1');
    rGrids.appendChild(vl);
    const hl = document.createElementNS(ns,'line');
    hl.setAttribute('x1',origin.x);          hl.setAttribute('y1',origin.y+mid);
    hl.setAttribute('x2',origin.x+rN*rCell); hl.setAttribute('y2',origin.y+mid);
    hl.setAttribute('stroke','#999'); hl.setAttribute('stroke-width','1');
    rGrids.appendChild(hl);
    const hi = document.createElementNS(ns,'rect');
    hi.setAttribute('x', origin.x + quad.cMin*rCell);
    hi.setAttribute('y', origin.y + quad.rMin*rCell);
    hi.setAttribute('width',  (quad.cMax-quad.cMin)*rCell);
    hi.setAttribute('height', (quad.rMax-quad.rMin)*rCell);
    hi.setAttribute('fill','none'); hi.setAttribute('stroke', col);
    hi.setAttribute('stroke-width','3');
    rGrids.appendChild(hi);
  });
// ══════════════════════════════════════════════
  // ELECTRODES — add/edit rows here only
 const EL_LENGTH_DEFAULT = 60;
  const EL_ANGLE_DEFAULT  = 25;

  const electrodes = [
    { cx: 227, cy: 128 },                        // electrode 0 — length 60, angle 25
    { cx: 390, cy: 120 },                        // electrode 1 — length 60, angle 25
    { cx: 227, cy: -100 },                       // electrode 2 — length 60, angle 25
    { cx: 390, cy: -100 },                       // electrode 3 — length 60, angle 25
    { cx: 200, cy: 200, length: 80, angle: 1 }   // electrode 4 — length 80, angle 1
  ];

  electrodes.forEach((el, idx) => {
    const g      = document.getElementById(`el-${idx}`);
    const len    = el.length ?? EL_LENGTH_DEFAULT;  // use own or default
    const angle  = el.angle  ?? EL_ANGLE_DEFAULT;
    const top    = el.cy - len;
    const rot    = `rotate(${angle},${el.cx},${el.cy})`;

    const shaft = document.createElementNS(ns, 'polygon');
    shaft.setAttribute('points',
      `${el.cx-2},${top} ${el.cx+2},${top} ${el.cx+1},${el.cy-8} ${el.cx},${el.cy} ${el.cx-1},${el.cy-8}`);
    shaft.setAttribute('fill','#666');
    shaft.setAttribute('stroke','#333');
    shaft.setAttribute('stroke-width','1');
    shaft.setAttribute('transform', rot);

    const cap = document.createElementNS(ns, 'rect');
    cap.setAttribute('x',      el.cx - 3);
    cap.setAttribute('y',      top);
    cap.setAttribute('width',  6);
    cap.setAttribute('height', 8);
    cap.setAttribute('rx',     2);
    cap.setAttribute('fill',  '#888');
    cap.setAttribute('stroke','#333');
    cap.setAttribute('stroke-width','1');
    cap.setAttribute('transform', rot);

    const tip = document.createElementNS(ns, 'circle');
    tip.setAttribute('cx', el.cx);
    tip.setAttribute('cy', el.cy);
    tip.setAttribute('r',  2.5);
    tip.setAttribute('fill',  '#111');
    tip.setAttribute('stroke','#333');
    tip.setAttribute('stroke-width','1');
    tip.setAttribute('transform', rot);

    g.appendChild(shaft);
    g.appendChild(cap);
    g.appendChild(tip);
  });
})();   // ← this is your existing closing line, don't add another
// })();
</script>
